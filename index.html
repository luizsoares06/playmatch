<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayMatch — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: var(--bg-primary); overflow: hidden;
    }
    body::before {
      content: ''; position: absolute; top: -30%; right: -20%;
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(124,58,237,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: ''; position: absolute; bottom: -20%; left: -15%;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(232,73,15,0.07) 0%, transparent 70%);
      pointer-events: none;
    }
    .login-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 18px; padding: 40px 36px; width: 360px;
      position: relative; z-index: 1;
      animation: fadeUp .4s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .login-logo { text-align: center; margin-bottom: 8px; }
    .login-logo .icon { font-size: 2rem; display: block; margin-bottom: 6px; }
    .login-logo .brand { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; }
    .login-logo .brand span { color: var(--accent); }
    .login-tagline { text-align: center; font-size: .77rem; color: var(--text-muted); margin-bottom: 28px; }
    .login-form { display: flex; flex-direction: column; gap: 16px; }
    .btn-login {
      background: var(--accent); color: #fff; border: none;
      border-radius: var(--radius-sm); padding: 11px 16px;
      font-size: .9rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 4px;
      transition: background .15s, transform .15s;
    }
    .btn-login:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .login-footer { text-align: center; margin-top: 18px; font-size: .78rem; color: var(--text-muted); }
    .login-footer a { color: var(--accent); }
    .sep { margin: 0 6px; opacity: .4; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <span class="icon">🎮</span>
      <div class="brand">Play<span>Match</span></div>
    </div>
    <p class="login-tagline">Gestão de Torneios de E-Sports e Ligas Amadoras</p>

    <div id="msg" class="alert" style="display:none;"></div>

    <div class="login-form">
      <div class="form-group">
        <label class="form-label">E-Mail</label>
        <input type="email" id="email" class="form-control" placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">Senha</label>
        <input type="password" id="senha" class="form-control" placeholder="••••••••">
      </div>
      <button class="btn-login" id="btn" onclick="fazerLogin()">
        Entrar na Plataforma →
      </button>
    </div>

    <div class="login-footer">
      Não tem conta? <a href="#">Cadastre-se grátis</a>
      <span class="sep">·</span>
      <a href="#">Esqueci a senha</a>
    </div>
  </div>

<script>
  async function fazerLogin() {
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value.trim();
    const btn   = document.getElementById('btn');
    const msg   = document.getElementById('msg');

    if (!email || !senha) {
      mostrarMsg('Preencha e-mail e senha.', 'erro'); return;
    }

    btn.disabled = true;
    btn.textContent = 'Entrando...';

    try {
      const resp  = await fetch('http://localhost/playmatch/api/auth/login.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, senha })
      });
      const dados = await resp.json();

      if (dados.sucesso) {
        sessionStorage.setItem('usuario', JSON.stringify(dados.usuario));
        window.location.href = '/playmatch/dashboard.html';
      } else {
        mostrarMsg(dados.erro || 'Erro ao fazer login.', 'erro');
        btn.disabled = false;
        btn.textContent = 'Entrar na Plataforma →';
      }
    } catch(e) {
      mostrarMsg('Não foi possível conectar. Verifique se o XAMPP está rodando.', 'erro');
      btn.disabled = false;
      btn.textContent = 'Entrar na Plataforma →';
    }
  }

  function mostrarMsg(texto, tipo) {
    const el = document.getElementById('msg');
    el.textContent = (tipo === 'erro' ? '✗  ' : '✓  ') + texto;
    el.className = `alert alert-${tipo === 'erro' ? 'error' : 'success'}`;
    el.style.display = 'flex';
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });
</script>
</body>
</html>
